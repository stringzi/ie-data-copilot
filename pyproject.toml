[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ie-data-copilot"
version = "0.2.0"
description = "AI-assisted industrial engineering data analysis copilot"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Gai Jiahao" }]
dependencies = [
    "streamlit>=1.36,<2.0",
    "pandas>=2.0,<3.0",
    "numpy>=1.24,<3.0",
    "matplotlib>=3.7,<4.0",
    "seaborn>=0.13,<1.0",
    "openai>=1.35,<3.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["ie_copilot*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
